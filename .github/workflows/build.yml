name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descompactar projeto
        run: |
          mkdir projeto
          unzip -q Lanterna_Android_Script_Completo.zip -d projeto

      - name: Dar permissão ao Gradle
        run: |
          chmod +x projeto/gradlew

      - name: Compilar APK
        working-directory: projeto
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LanternaAndroid
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
